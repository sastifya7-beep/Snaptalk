<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapTalk Pro</title>
<style>
:root{--bg:#000;--card:#1e293b;--nav:#0f172a;--text:#fff;--muted:#94a3b8;--blue:#3b82f6;--red:#ef4444;}
body.light{--bg:#f1f5f9;--card:#fff;--nav:#fff;--text:#000;--muted:#64748b;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI';}
body{background:var(--bg);color:var(--text);}
.hidden{display:none!important;}
/* LOGIN */
#loginPage{background:linear-gradient(135deg,#0f172a,#020617);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
.auth-box{background:var(--card);padding:35px 25px;border-radius:20px;width:100%;max-width:400px;text-align:center;box-shadow:0 0 40px rgba(59,130,246,.4);}
.auth-box h1{color:var(--blue);margin-bottom:10px;font-size:32px;}
.auth-box input{width:100%;padding:15px;margin:10px 0;border:1px solid #334155;border-radius:12px;background:#0f172a;color:#fff;}
.login-btn{width:100%;padding:15px;background:linear-gradient(90deg,#2563eb,#3b82f6);border:none;border-radius:12px;color:#fff;font-weight:800;font-size:17px;margin:15px 0;cursor:pointer;}
.fb-btn{width:100%;padding:15px;background:#1877f2;border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;}
/* APP */
header{position:sticky;top:0;background:var(--nav);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;z-index:10;}
.logo{font-size:22px;font-weight:900;color:var(--blue);}
.icon-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;}
.container{padding-bottom:80px;}
.search-bar{padding:10px;background:var(--card);margin:10px;border-radius:10px;display:flex;gap:10px;}
.search-bar input{flex:1;background:#0f172a;border:none;padding:10px;border-radius:8px;color:var(--text);}
/* POST */
.post{background:var(--card);margin:10px;border-radius:12px;overflow:hidden;}
.post-header{display:flex;align-items:center;gap:10px;padding:12px;justify-content:space-between;}
.post-avatar{width:40px;height:40px;border-radius:50%;}
.post-img{width:100%;}
.post-actions{display:flex;justify-content:space-between;padding:10px 12px;font-size:22px;}
.post-actions button{background:none;border:none;color:var(--text);cursor:pointer;}
.post-actions button.liked{color:var(--red);}
.comment-box{display:flex;padding:10px;gap:8px;}
.comment-box input{flex:1;background:#0f172a;border:none;padding:10px;border-radius:8px;color:var(--text);}
/* REELS */
.reels-container{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;}
.reel{height:100vh;position:relative;scroll-snap-align:start;background:#000;}
.reel video{height:100%;width:100%;object-fit:cover;}
.reel-user{position:absolute;bottom:100px;left:10px;display:flex;align-items:center;gap:10px;}
.reel-actions{position:absolute;bottom:100px;right:10px;display:flex;flex-direction:column;gap:20px;font-size:28px;text-align:center;}
/* LIVE */
.live-card{background:var(--card);margin:10px;padding:15px;border-radius:12px;display:flex;align-items:center;gap:15px;cursor:pointer;}
.live-badge{background:var(--red);padding:3px 8px;border-radius:5px;font-size:12px;}
.locked{opacity:0.4;}
/* CALLER */
.caller-contact{display:flex;align-items:center;gap:15px;padding:12px;background:var(--card);margin:10px;border-radius:10px;cursor:pointer;justify-content:space-between;}
#gameCanvas{background:#000;border:2px solid var(--blue);display:block;margin:10px auto;border-radius:8px;}
/* PROFILE */
.profile-header{padding:20px;text-align:center;}
.profile-header img{width:90px;height:90px;border-radius:50%;border:3px solid var(--blue);}
.profile-stats{display:flex;justify-content:center;gap:20px;margin:15px 0;}
.btn{background:var(--blue);border:none;padding:10px 20px;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;margin:5px;}
.btn.red{background:var(--red);}
.btn.gray{background:#334155;}
/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #334155;z-index:50;}
.bottom-nav button{background:none;border:none;color:var(--muted);font-size:22px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.bottom-nav button.active{color:var(--blue);}
.bottom-nav span{font-size:10px;}
/* MODAL */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:100;}
.modal-box{background:var(--card);padding:20px;border-radius:12px;width:90%;max-width:400px;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card);padding:10px 20px;border-radius:20px;z-index:200;}
 </style>। <script>
document.getElementById('loginBtn').onclick = function() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appPage').style.display = 'block';
    alert("Welcome to SnapTalk! 🎉")
}
 </script>

}
</script>
</head>
<body>

<!-- 1. LOGIN PAGE -->
<div id="loginPage">
  <div class="auth-box">
    <h1>SnapTalk ЁЯФе</h1>
    <input type="email" id="emailInput" placeholder="Email рдбрд╛рд▓реЛ" required>
    <input type="password" id="passwordInput" placeholder="Password рдбрд╛рд▓реЛ" required>
    <button class="login-btn" id="loginBtn">LOGIN</button>
    <button class="fb-btn" onclick="toast('Facebook Login Coming Soon')">Sign In with Facebook</button>
  </div>
</div>

<!-- 2. MAIN APP -->
<div id="appPage" class="hidden">
  <header>
    <div class="logo">SnapTalk</div>
    <div>
      <button class="icon-btn" onclick="toggleSearch()">ЁЯФН</button>
      <button class="icon-btn" onclick="showNotif()">ЁЯФФ</button>
      <button class="icon-btn" onclick="toggleDark()">ЁЯМЩ</button>
    </div>
  </header>

  <div id="searchBar" class="search-bar hidden"><input type="text" placeholder="User search рдХрд░реЛ..." onkeyup="searchUser(this.value)"></div>

  <!-- HOME TAB -->
  <div id="homeTab" class="container"><div id="homeFeed"></div></div>

  <!-- REELS TAB -->
  <div id="reelsTab" class="container hidden"><div class="reels-container" id="reelsContainer"></div></div>

  <!-- LIVE TAB -->
  <div id="liveTab" class="container hidden"><h2 style="padding:15px;">Live ЁЯФ┤</h2><div id="liveList"></div></div>

  <!-- CALLER TAB -->
  <div id="callerTab" class="container hidden">
    <h2 style="padding:15px;">Caller</h2>
    <button onclick="getContacts()" class="btn" style="margin:10px;">ЁЯУ▒ Contacts Access рдХрд░реЛ</button>
    <div id="callerList"></div>
    <div style="padding:10px;text-align:center;">
      <h3>Snake Game ЁЯРН Target: 20 Food</h3>
      <p>Score: <span id="foodCount">0</span>/20</p>
      <canvas id="gameCanvas" width="300" height="300"></canvas>
      <button onclick="startGame()" class="btn">Start Game</button>
    </div>
  </div>

  <!-- PROFILE TAB -->
  <div id="profileTab" class="container hidden">
    <div class="profile-header">
      <img id="profilePic" src="https://i.pravatar.cc/150?img=5">
      <h2 id="userName">User</h2>
      <p style="color:var(--muted)">Bio: Coder | Creator</p>
      <div class="profile-stats">
        <div><b>12</b><div>Posts</div></div>
        <div><b id="followers">1.2K</b><div>
